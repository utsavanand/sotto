name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.5
      - run: ruff check sotto.py
      - run: python -m py_compile sotto.py
      - run: bash -n install.sh run.sh

  # arm64 macOS runner: resolves the hashed lock exactly as install.sh will,
  # so a malformed or incomplete lock cannot merge undetected
  lock-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install --dry-run --require-hashes --no-deps -r requirements.lock
