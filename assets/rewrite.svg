    <text x="30" y="126" font-size="15" fill="#24292f" font-style="italic">to <tspan fill="#9aa0a8">like</tspan> next Thursday because</text>
    <text x="30" y="150" font-size="15" fill="#24292f" font-style="italic"><tspan fill="#9aa0a8">you know</tspan> QA is still, <tspan fill="#9aa0a8">um,</tspan> still</text>
    <text x="30" y="174" font-size="15" fill="#24292f" font-style="italic">working through the payment</text>
    <text x="30" y="198" font-size="15" fill="#24292f" font-style="italic">bugs”</text>
