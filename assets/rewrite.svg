  <text x="392" y="80" font-size="24" fill="#8b949e">→</text>
  <text x="392" y="185" font-size="24" fill="#8b949e">→</text>

  <!-- clean up -->
  <g>
    <rect x="425" y="15" width="465" height="103" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
