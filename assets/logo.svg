<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252a41"/>
      <stop offset="1" stop-color="#13131b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6d9e8"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px squircle centered on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <!-- mic capsule -->
  <rect x="427" y="212" width="170" height="320" rx="85" fill="url(#mic)"/>
  <!-- pickup arc -->
  <path d="M 332 532 a 180 180 0 0 0 360 0" stroke="#7aa2f7" stroke-width="46"
        fill="none" stroke-linecap="round"/>
  <!-- stem and base -->
  <line x1="512" y1="712" x2="512" y2="770" stroke="#e8e8f0" stroke-width="46"
        stroke-linecap="round"/>
  <line x1="402" y1="813" x2="622" y2="813" stroke="#e8e8f0" stroke-width="46"
        stroke-linecap="round"/>
</svg>
