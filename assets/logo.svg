<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3154"/>
      <stop offset="1" stop-color="#141726"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- macOS icon grid: 824px squircle centered on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>

  <!-- A voice trailing off: bars fall in height and fade from white to
       blue, left to right. Centered on y=512 so the mark reads as one
       shape rather than a row of ticks. -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#f2f5fd">
      <path d="M286 476 v72" stroke-width="40"/>
      <path d="M368 404 v216" stroke-width="40"/>
      <path d="M450 350 v324" stroke-width="40"/>
    </g>
    <g stroke="#dbe3f8">
      <path d="M532 396 v232" stroke-width="40"/>
    </g>
    <g stroke="#9fbaf9">
      <path d="M614 442 v140" stroke-width="40"/>
    </g>
    <g stroke="#7aa2f7">
      <path d="M696 472 v80" stroke-width="40"/>
      <path d="M778 500 v24" stroke-width="40"/>
    </g>
  </g>
</svg>
